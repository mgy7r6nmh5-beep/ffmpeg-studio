<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cff"/>
      <stop offset="52%" stop-color="#5f7bff"/>
      <stop offset="100%" stop-color="#29d3ee"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 渐变圆角方底 -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#g)"/>
  <!-- 顶部高光，让底面有质感 -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#sheen)"/>

  <!-- 播放三角：先画一层偏移的深色做投影，再叠白色 -->
  <path d="M212 172 L212 340 L368 256 Z" fill="#0b0e16" fill-opacity="0.16"/>
  <path d="M206 166 L206 346 L362 256 Z" fill="#ffffff"/>

  <!-- 右下角三条渐隐竖线：暗示音视频轨道 / 处理 -->
  <g fill="#ffffff">
    <rect x="382" y="300" width="14" height="56" rx="7" fill-opacity="0.85"/>
    <rect x="404" y="286" width="14" height="84" rx="7" fill-opacity="0.6"/>
    <rect x="426" y="312" width="14" height="32" rx="7" fill-opacity="0.38"/>
  </g>
</svg>
